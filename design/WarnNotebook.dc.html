<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <script src="./support.js"></script>
    </head>
    <body>
        <x-dc>
            <helmet>
                <title>B · first-run warning</title>
                <link
                    rel="stylesheet"
                    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600&display=swap"
                />
                <style>
                    body {
                        margin: 0;
                        background: #1a1714;
                        color: #e9e3d8;
                        font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
                        font-size: 13.5px;
                    }
                    a {
                        color: #fcbe11;
                    }
                    a:hover {
                        color: #ffd65c;
                    }
                    .page {
                        position: relative;
                        width: 1440px;
                        height: 900px;
                        box-sizing: border-box;
                        padding: 40px 44px 36px;
                        background: #1a1714;
                        overflow: hidden;
                    }
                    .grain {
                        position: absolute;
                        inset: 0;
                        pointer-events: none;
                        opacity: 0.5;
                    }
                    .sheet {
                        position: relative;
                        background: #25211d;
                        border: 1px solid rgba(255, 255, 255, 0.045);
                        box-shadow:
                            0 1px 0 rgba(255, 255, 255, 0.03) inset,
                            0 18px 40px rgba(0, 0, 0, 0.45);
                    }
                    .sheet::before {
                        content: "";
                        position: absolute;
                        inset: -1px;
                        transform: translate(9px, 9px);
                        background: #2c2722;
                        border: 1px solid rgba(255, 255, 255, 0.04);
                        z-index: -1;
                    }
                    .sheet::after {
                        content: "";
                        position: absolute;
                        inset: -1px;
                        transform: translate(18px, 18px);
                        background: #211d19;
                        border: 1px solid rgba(255, 255, 255, 0.03);
                        z-index: -2;
                    }
                    .head {
                        display: flex;
                        align-items: flex-end;
                        justify-content: space-between;
                        margin-bottom: 26px;
                    }
                    .brand {
                        display: flex;
                        align-items: flex-end;
                        gap: 16px;
                    }
                    .brand img {
                        height: 44px;
                        width: auto;
                        display: block;
                    }
                    .title {
                        font-family: "Instrument Serif", "Georgia", serif;
                        font-size: 44px;
                        line-height: 0.95;
                        color: #f4efe6;
                        letter-spacing: -0.01em;
                    }
                    .title i {
                        color: #fcbe11;
                    }
                    .meta {
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 12px;
                        color: #9a9187;
                        text-align: right;
                        line-height: 1.6;
                    }
                    .meta b {
                        color: #f4efe6;
                        font-weight: 400;
                    }
                    .lab {
                        font-family: "Libre Franklin", sans-serif;
                        font-weight: 600;
                        font-size: 10.5px;
                        letter-spacing: 0.18em;
                        text-transform: uppercase;
                        color: #8f8479;
                    }
                    .strip {
                        display: grid;
                        grid-template-columns: minmax(0, 1fr) 300px;
                        gap: 28px;
                        padding: 18px 22px 16px;
                        margin-bottom: 22px;
                    }
                    .strip-l {
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                    }
                    .ruler {
                        border: 1px solid rgba(255, 255, 255, 0.06);
                        background: #25211d;
                    }
                    .strip-r {
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        gap: 10px;
                        border-left: 1px dashed rgba(244, 239, 230, 0.18);
                        padding-left: 26px;
                    }
                    .big {
                        font-family: "Instrument Serif", serif;
                        font-size: 64px;
                        line-height: 0.9;
                        color: #f4efe6;
                        letter-spacing: -0.01em;
                    }
                    .big i {
                        font-size: 26px;
                        color: #fcbe11;
                        margin-left: 6px;
                    }
                    .key {
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 12px;
                        color: #9a9187;
                    }
                    .ctl {
                        display: flex;
                        align-items: center;
                        gap: 18px;
                        margin-top: 6px;
                    }
                    .lvl {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 13px;
                        color: #e9e3d8;
                    }
                    .lvl .bar {
                        width: 110px;
                        height: 2px;
                        background: rgba(244, 239, 230, 0.2);
                        position: relative;
                    }
                    .lvl .bar::after {
                        content: "";
                        position: absolute;
                        left: 62%;
                        top: -5px;
                        width: 12px;
                        height: 12px;
                        border-radius: 50%;
                        background: #fcbe11;
                        box-shadow: 0 0 0 3px #25211d;
                    }
                    .lnk {
                        font-family: "Libre Franklin", sans-serif;
                        font-weight: 500;
                        font-size: 12.5px;
                        color: #f4efe6;
                        border-bottom: 1.5px solid #fcbe11;
                        padding-bottom: 1px;
                        display: inline-flex;
                        align-items: center;
                        gap: 6px;
                        cursor: pointer;
                    }
                    .row {
                        display: grid;
                        grid-template-columns: minmax(0, 1fr) 400px;
                        gap: 28px;
                        margin-bottom: 22px;
                    }
                    .graph {
                        padding: 18px 22px 16px;
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    }
                    .aside {
                        display: flex;
                        flex-direction: column;
                        gap: 22px;
                    }
                    .marks {
                        padding: 18px 22px 16px;
                    }
                    .markrow {
                        display: flex;
                        gap: 10px;
                        margin-top: 12px;
                    }
                    .mk {
                        flex: 1 1 0;
                        height: 52px;
                        border: 1px solid rgba(244, 239, 230, 0.22);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        gap: 2px;
                        cursor: pointer;
                        background: transparent;
                    }
                    .mk:first-child {
                        border-color: #fcbe11;
                    }
                    .mk b {
                        font-family: "Instrument Serif", serif;
                        font-weight: 400;
                        font-size: 20px;
                        color: #f4efe6;
                        line-height: 1;
                    }
                    .mk span {
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 10.5px;
                        color: #9a9187;
                    }
                    .note {
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 11.5px;
                        color: #9a9187;
                        margin-top: 12px;
                        font-style: italic;
                    }
                    .bands {
                        padding: 18px 22px 14px;
                        flex: 1 1 auto;
                    }
                    table {
                        border-collapse: collapse;
                        width: 100%;
                        margin-top: 10px;
                    }
                    th {
                        text-align: left;
                        font-family: "Libre Franklin", sans-serif;
                        font-weight: 600;
                        font-size: 10px;
                        letter-spacing: 0.16em;
                        text-transform: uppercase;
                        color: #8f8479;
                        padding: 0 6px 8px 0;
                        border-bottom: 1px solid rgba(244, 239, 230, 0.25);
                    }
                    td {
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 13px;
                        color: #e9e3d8;
                        padding: 9px 6px 9px 0;
                        border-bottom: 1px dashed rgba(244, 239, 230, 0.14);
                        vertical-align: middle;
                    }
                    td.n {
                        color: #8f8479;
                        width: 18px;
                    }
                    td.g {
                        color: #fcbe11;
                    }
                    td.on {
                        width: 26px;
                        text-align: right;
                    }
                    tr.active td {
                        background: linear-gradient(90deg, rgba(252, 190, 17, 0.1), transparent 70%);
                    }
                    tr.empty td {
                        color: #5c554e;
                        font-style: italic;
                        border-bottom: none;
                    }
                    .dot {
                        display: inline-block;
                        width: 9px;
                        height: 9px;
                        border-radius: 50%;
                        background: #fcbe11;
                    }
                    .export {
                        padding: 18px 22px 16px;
                        display: grid;
                        grid-template-columns: minmax(0, 1fr) 240px;
                        gap: 28px;
                    }
                    .pre {
                        margin: 8px 0 0;
                        font-family: "Courier Prime", "Courier New", monospace;
                        font-size: 12px;
                        line-height: 1.55;
                        color: #e9e3d8;
                        white-space: pre;
                    }
                    .pre b {
                        color: #fcbe11;
                        font-weight: 400;
                    }
                    .ex-r {
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        gap: 14px;
                        border-left: 1px dashed rgba(244, 239, 230, 0.18);
                        padding-left: 26px;
                    }
                    .pill {
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                        height: 38px;
                        padding: 0 16px;
                        border: 1px solid #fcbe11;
                        color: #fcbe11;
                        font-family: "Libre Franklin", sans-serif;
                        font-weight: 600;
                        font-size: 12.5px;
                        letter-spacing: 0.04em;
                        cursor: pointer;
                    }
                    .pill.solid {
                        background: #fcbe11;
                        color: #1a1300;
                    }
                </style>
            </helmet>

            <div
                style="
                    position: relative;
                    width: 720px;
                    height: 460px;
                    box-sizing: border-box;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #1a1714;
                    font-family: &quot;Libre Franklin&quot;, sans-serif;
                    overflow: hidden;
                "
            >
                <svg class="grain" xmlns="http://www.w3.org/2000/svg">
                    <filter id="g">
                        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
                        <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.07 0" />
                    </filter>
                    <rect width="100%" height="100%" filter="url(#g)" />
                </svg>
                <div
                    class="sheet"
                    style="width: 500px; padding: 28px 30px 26px; display: flex; flex-direction: column; gap: 16px"
                >
                    <div class="lab">Before you start</div>
                    <div
                        style="
                            font-family: &quot;Instrument Serif&quot;, serif;
                            font-size: 38px;
                            line-height: 1;
                            color: #f4efe6;
                        "
                    >
                        Turn your volume <i style="color: #fcbe11">down</i> first.
                    </div>
                    <div style="font-size: 14px; line-height: 1.55; color: #cfc7bb">
                        Sine tones at high level can damage hearing and equipment. Start quiet, then raise the level to
                        where you normally listen to music.
                    </div>
                    <div
                        style="
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            padding-top: 14px;
                            border-top: 1px dashed rgba(244, 239, 230, 0.2);
                        "
                    >
                        <div class="lvl">
                            level
                            <div class="bar" style="--x: 10%"></div>
                            −40 dB
                        </div>
                        <span class="pill solid"
                            ><svg
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#1a1300"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path d="M12 3v9" />
                                <path d="M6.3 6.3a8 8 0 1 0 11.4 0" />
                            </svg>
                            I understand - start</span
                        >
                    </div>
                </div>
            </div>
        </x-dc>
    </body>
</html>
