<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>D · first-run warning</title>
  
  <style>

    body { margin:0; background:#f6f4ef; color:#171614; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
    a { color:#171614; } a:hover { color:#FCBE11; }
    .page { width:1440px; height:900px; box-sizing:border-box; padding:44px 64px 40px; display:flex; flex-direction:column; gap:0; background:#f6f4ef; }
    .top { display:flex; align-items:center; justify-content:space-between; height:36px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark { width:34px; height:34px; border-radius:50%; background:#111; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 0 1px #cfcabf; }
    .mark img { height:19px; width:auto; display:block; }
    .wm { font-weight:700; font-size:17px; letter-spacing:-0.01em; }
    .wm span { font-weight:400; color:#8a867e; margin-left:6px; }
    .nav { display:flex; align-items:center; gap:28px; font-size:13.5px; color:#8a867e; }
    .nav b { font-weight:500; color:#171614; display:inline-flex; align-items:center; gap:6px; }
    .nav .on::before { content:""; width:6px; height:6px; border-radius:50%; background:#FCBE11; display:inline-block; margin-right:8px; vertical-align:middle; }
    .rule { height:1px; background:#e2ded4; margin:18px 0 0; }
    .strip { display:grid; grid-template-columns: minmax(0,1fr) 300px; gap:64px; align-items:end; padding:34px 0 26px; border-bottom:1px solid #e2ded4; }
    .cap { font-size:12px; letter-spacing:0.02em; color:#8a867e; margin-bottom:12px; display:flex; justify-content:space-between; }
    .cap kbd { font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:11.5px; color:#8a867e; }
    .freq { display:flex; align-items:baseline; justify-content:flex-end; gap:10px; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight:400; font-size:64px; line-height:0.9; letter-spacing:-0.03em; color:#171614; font-variant-numeric:tabular-nums; }
    .freq small { font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight:400; font-size:15px; color:#8a867e; letter-spacing:0; }
    .sub { display:flex; justify-content:flex-end; align-items:center; gap:22px; margin-top:16px; font-size:13px; color:#8a867e; }
    .lvl { display:flex; align-items:center; gap:10px; }
    .lvl .bar { width:96px; height:1px; background:#cfcabf; position:relative; }
    .lvl .bar::after { content:""; position:absolute; left:64%; top:-4px; width:9px; height:9px; border-radius:50%; background:#171614; }
    .lvl span { font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; color:#171614; font-size:12.5px; font-variant-numeric:tabular-nums; }
    .tb { display:inline-flex; align-items:center; gap:7px; color:#171614; font-weight:500; cursor:pointer; }
    .row { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:64px; flex:1 1 auto; min-height:0; padding-top:28px; }
    .graph { display:flex; flex-direction:column; min-height:0; }
    .aside { display:flex; flex-direction:column; gap:34px; }
    .h { font-size:12px; color:#8a867e; margin-bottom:14px; display:flex; justify-content:space-between; }
    .marks { display:flex; gap:8px; }
    .mk { flex:1 1 0; height:44px; border:1px solid #cfcabf; border-radius:999px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13.5px; font-weight:500; color:#171614; cursor:pointer; }
    .mk kbd { font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:11.5px; color:#8a867e; }
    .mk.next { border-color:#171614; }
    .fn { font-size:12px; color:#8a867e; margin-top:10px; }
    .list { display:flex; flex-direction:column; }
    .band { display:grid; grid-template-columns: 14px 34px 74px 66px 52px 1fr; align-items:center; gap:10px; height:42px; border-top:1px solid #e2ded4; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:13.5px; color:#171614; font-variant-numeric:tabular-nums; }
    .band:last-child { border-bottom:1px solid #e2ded4; }
    .band .n { color:#b9b5ab; font-size:11.5px; }
    .band .t { font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:12.5px; color:#8a867e; }
    .band .g { color:#171614; }
    .band .sw { justify-self:end; width:26px; height:14px; border-radius:7px; background:#FCBE11; position:relative; }
    .band .sw::after { content:""; position:absolute; top:2px; right:2px; width:10px; height:10px; border-radius:50%; background:#f6f4ef; }
    .band.empty { font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; color:#b9b5ab; font-size:12.5px; grid-template-columns: 14px 1fr; }
    .band.cur .n { color:#FCBE11; }
    .export { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:64px; align-items:center; padding-top:22px; border-top:1px solid #e2ded4; }
    .pre { margin:0; font-family:Menlo, Consolas, 'Courier New', monospace; font-size:12px; line-height:1.6; color:#8a867e; white-space:pre; }
    .pre b { color:#171614; font-weight:400; }
    .acts { display:flex; align-items:center; gap:22px; justify-content:flex-end; }
    .btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px; border-radius:999px; background:#171614; color:#f6f4ef; font-size:13.5px; font-weight:500; cursor:pointer; }
    .btn.y { background:#FCBE11; color:#1a1300; }
    .lnk { font-size:13.5px; font-weight:500; color:#171614; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
    .pa { font-size:12.5px; color:#8a867e; } .pa span { color:#171614; margin-left:8px; }

  </style>
</helmet>

<div style="width:720px; height:460px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; background:#f6f4ef; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; color:#171614;">
  <div style="width:440px; display:flex; flex-direction:column; gap:18px;">
    <span style="width:48px; height:48px; border-radius:50%; background:#111; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px #cfcabf;"><img src="dms-mark.png" alt="DMS" style="height:26px; width:auto; display:block;"></span>
    <div style="font-size:30px; font-weight:500; letter-spacing:-0.02em; line-height:1.1;">Turn your volume down first.</div>
    <div style="font-size:15px; line-height:1.55; color:#8a867e;">Sine tones at high level can damage hearing and equipment. Start quiet, then raise the level to where you normally listen to music.</div>
    <div style="display:flex; align-items:center; justify-content:space-between; padding-top:16px; border-top:1px solid #e2ded4;">
      <div class="lvl" style="display:flex; align-items:center; gap:10px; font-size:13px; color:#8a867e;">Level <div style="width:96px; height:1px; background:#cfcabf; position:relative;"><div style="position:absolute; left:8%; top:-4px; width:9px; height:9px; border-radius:50%; background:#171614;"></div></div><span style="font-family:Menlo, Consolas, 'Courier New', monospace; color:#171614; font-size:12.5px;">−40 dB</span></div>
      <span class="btn y" style="display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px; border-radius:999px; background:#FCBE11; color:#1a1300; font-size:13.5px; font-weight:500;">I understand, start</span>
    </div>
  </div>
</div>

</x-dc>
